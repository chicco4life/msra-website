- slug: calmcat
  name: CalmCat
  status: dev
  code: MSRA-06
  taxon: Felidae
  price: ''
  image_alt: CalmCat lickable purée sticks, packaging concept
  group: cats
  species: Cats and kittens from 6 months
  format: Calming purée
  pack: 30 sticks × 14 g
  image: calmcat.webp
  tagline: Daily calming support in a purée cats actually finish
  blurb: 'A lickable purée stick with alpha-casozepine and L-theanine for cats facing change: new homes, new companions, visitors, travel. Made for cats who refuse chews and capsules.'
  problem: 'Stress in indoor and multi-cat homes rarely looks dramatic. It looks like a cat that hides when visitors arrive, tension between housemates, or a cat that vanishes the moment the carrier comes out. Many owners have already tried a plug-in diffuser and then a calming chew. The chew is usually where it fails: the best-known calming chew for cats averages around three stars, and in one review only one of four cats would eat it. Capsules mean pilling an already stressed cat. A product the cat refuses delivers nothing.'
  why: 'We built CalmCat around the one thing every failed product had in common: refusal. The format is a lickable purée stick, the treat format cats already finish, flavoured with liver and the savoury notes cats can taste, with no sugar because cats cannot taste sweet. Inside is alpha-casozepine, the calming ingredient with the most cat research behind it, with L-theanine. We say plainly what the evidence shows, including the trials that found little, and we ask owners to allow two to four weeks.'
  research:
  - 'Owner-problem phase first: four market research runs read retailer reviews, owner forums and competitor labels across the US, UK and EU. The pattern was consistent: calming products for cats fail on refusal before efficacy is ever tested.'
  - 'Literature pass: our AI-powered research system ran 103 searches and cross-checked 42 PubMed-indexed papers; our team reviewed every ingredient and claim. Alpha-casozepine had the most controlled cat research of any calming ingredient. We found no cat trials for valerian, magnolia, GABA, ashwagandha or chamomile.'
  - A second, stricter pass required a published source for every dose. It removed N-acetyl glucosamine after a six-month placebo-controlled trial in 40 cats found no difference from placebo, and excluded alpha-lipoic acid, about ten times more toxic to cats than reported in dogs.
  - A second, independent research run re-checked every citation. We could not obtain the full text of the earliest positive cat trial, so we do not quote its figures. No study has tested our two calming ingredients together, so we make no synergy claim.
  - 'Also rejected: CBD (the one clean cat trial found no effect, and it is not permitted in EU feed), melatonin (regulatory status), and sugars, which cats cannot taste and which degrade the actives during heat sterilisation.'
  inside:
  - name: Alpha-casozepine (milk protein hydrolysate)
    role: Calming peptide from milk protein; the calming ingredient with the most published cat research.
  - name: L-theanine
    role: Amino acid from tea leaves; a second calming ingredient, supported by an open-label cat study.
  - name: Taurine
    role: Essential for cats; topped up because heat sterilisation raises the amount cats need.
  - name: Vitamin B6
    role: Cofactor the body uses to make serotonin.
  - name: Liver digest and savoury amino acids
    role: Flavour built on what cats can taste, with no sugar.
  - name: Tuna and chicken purée
    role: 'The carrier: a lickable treat format cats already finish.'
  evidence:
  - text: In 24 fearful cats fed a calming diet with alpha-casozepine and L-tryptophan or a control diet for 4 weeks, the groups differed on behaviour measures in an unfamiliar room, but not on fear of an unfamiliar person. Cats; a complete diet, not our purée.
    ref: 1
  - text: In an open-label study of 33 cats with stress-related signs, L-theanine for 30 days cut the median global stress score from 18 to 5, and 30 of 33 cats improved. No placebo group; cats, given as a tablet.
    ref: 2
  - text: A randomised, placebo-controlled trial in 60 cats at the vet gave alpha-casozepine for only 3 to 6 days. The only significant effect was fewer sweaty paws at the high dose. That is why CalmCat is a daily product, not a same-day fix.
    ref: 3
  - text: In rats given oral doses from 5 to 50 mg/kg, 15 mg/kg was the lowest effective dose of the casein hydrolysate, with effects similar to diazepam in standard behaviour tests but without its disinhibition. Rats; ingredient only.
    ref: 4
  limits:
  - 'Cat evidence for alpha-casozepine is mixed: a diet study was positive on some measures and a short-course vet-visit trial found little. CalmCat itself has not been tested in cats.'
  - The L-theanine cat data come from one open-label study without a placebo group, and no study has tested the two ingredients together.
  - Effects build over two to four weeks of daily use. CalmCat is not a same-day product, and it does not replace veterinary care.
  use: Once a day as a lickable treat, straight from the stick or squeezed onto a spoon. Larger cats may need more; follow the pack. Allow two to four weeks.
