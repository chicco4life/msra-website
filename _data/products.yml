- slug: gutdaily
  name: GutDaily
  status: next
  code: MSRA-02
  taxon: Lagomorpha
  price: ''
  image_alt: GutDaily live-culture hay biscuits, packaging concept
  group: small-mammals
  species: Rabbits, guinea pigs and chinchillas
  format: Live-culture hay biscuit
  pack: 60 biscuits × 3 g
  image: gutdaily.webp
  tagline: A live-culture hay biscuit they eat as a treat
  blurb: A one-a-day baked hay biscuit carrying live yeast culture, added after baking, plus a yeast-derived prebiotic. Live count guaranteed to the expiry date, not just at manufacture.
  problem: 'Owners who have been through a digestive slowdown with a rabbit or guinea pig do not forget it: the syringe feeding, the paste in the fridge, the daily photos of droppings, and emergency bills that run into thousands. Many want daily live-culture support around diet changes, moves and stress, but the options fail them. Powders are too dry to stick to food and get left in the bowl. Rescue pastes are made for emergencies and cost over £130 a month if used daily. And the best-loved digestive snacks contain no live culture at all.'
  why: 'GutDaily delivers a live culture in the one format small herbivores take willingly: a treat. We chose Saccharomyces cerevisiae CNCM I-4407, the only live culture authorised for rabbits in the EU, and apply it after baking, because baking destroys about 99% of live cultures. A yeast-derived prebiotic comes with it. The biscuit itself is grass hay, bound without starch or sugar, and specified so it does not dilute a hay diet. The live count is guaranteed to the expiry date.'
  research:
  - 'Owner-problem phase first: 112 searches across retailers, owner forums and competitor labels. Owners who had lived through a digestive emergency wanted daily support, but powders would not stick to food and the best-loved digestive snacks contained no live organism.'
  - 'Literature pass: our AI-powered research system extracted eleven controlled rabbit trials into one dose table; our team checked the arithmetic. We chose the strain from the EU feed-additive register, so the product is legal for rabbits from day one rather than retrofitted.'
  - A second, stricter pass changed the concept. One small biscuit is a minor share of daily intake, so it cannot be a fibre supplement; hay does that job. Baking destroys cultures, so the live yeast goes on after baking.
  - 'Rejected: a Lactobacillus ''restores the flora'' story (Lactobacillus is not a dominant rabbit gut genus and dies in baking), an Enterococcus strain without EU rabbit authorisation, and, for now, sodium butyrate, after a liver enzyme rose in a 600-rabbit trial.'
  inside:
  - name: Live yeast culture (Saccharomyces cerevisiae CNCM I-4407)
    role: The only live culture authorised for rabbits in the EU; applied after baking so it stays alive.
  - name: Mannan-oligosaccharides (yeast cell wall)
    role: Prebiotic partner to the yeast; together they outperformed either alone in growing rabbits.
  - name: Timothy or meadow hay flour
    role: High-fibre base, specified so the biscuit does not dilute a hay diet.
  - name: Guar gum
    role: Binds the biscuit without starch or sugar.
  - name: Refined vegetable oil
    role: Coating, held to an oxidation spec, that carries the live culture onto the baked biscuit.
  - name: Vanilla
    role: Flavour cue; the only palatant we found with published rabbit data.
  evidence:
  - text: In 32 weaned rabbits over 56 days, the group fed Saccharomyces cerevisiae yeast plus MOS had the best growth and feed conversion of four diets, with improved digestibility including fibre. Production rabbits; not our biscuit.
    ref: 1
  - text: In 120 weaned rabbits of two breeds, diets with MOS gave higher final body weight and feed intake than the control diet, plus better carcass traits. Production rabbits; MOS as a feed ingredient, not our biscuit.
    ref: 2
  - text: The only pet-rabbit study of our yeast strain was a double-blind crossover in 6 healthy rabbits. The yeast changed none of the measured gut bacteria, body weight or dropping size and weight. Small, but we disclose it.
    ref: 3
  limits:
  - Most evidence for this strain comes from young production rabbits; the only pet-rabbit study was small and found no effect. GutDaily has not yet been tested in animals.
  - No study shows that a probiotic prevents digestive emergencies in pet rabbits. A rabbit that stops eating or passing droppings needs a vet within hours.
  - The strain is authorised for rabbits in the EU. There is no species-specific evidence for it in guinea pigs or chinchillas.
  use: Give as a daily treat; follow the pack for your species, as chinchillas get less. Keep the pouch sealed, cool and dry to protect the live culture.
