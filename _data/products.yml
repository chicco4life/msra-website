    pmc: ''
- slug: plumacalm
  name: PlumaCalm
  status: dev
  code: MSRA-05
  taxon: Aves
  price: ''
  image_alt: PlumaCalm daily sticks for parrots, packaging concept
  group: birds
  species: Parrots, cockatoos, cockatiels, conures and budgerigars
  format: Food sprinkle (stick pack)
  pack: 30 sticks × 1 g (size L) or × 0.3 g (size S)
  image: plumacalm.webp
  tagline: Daily calm and feather support, sprinkled on fresh food
  blurb: A stick-pack powder for parrots built on insoluble fibre, the best-studied diet factor in feather pecking, plus L-tryptophan, alpha-casozepine and L-theanine. Sprinkled on damp food.
  problem: 'Owners of greys, cockatoos, cockatiels and conures dealing with feather plucking, screaming or night frights have usually done the vet workup, added UV lighting and foraging toys, and paid month after month for supplements that did nothing. Dosing is its own battle: forcing powder into the beak of a bird that hates it, or adding it to drinking water, where small birds often fail to take in a reliable dose. The one calming product built on a studied mechanism has a single active, costs a lot and is often out of stock.'
  why: We started from the evidence, not the trend. The best-studied dietary lever for feather pecking in birds is insoluble fibre, so in PlumaCalm the carrier is the lead active, not filler. To it we add L-tryptophan, the serotonin precursor linked to pecking in hens, the same calming peptide as our cat and small-mammal lines, and L-theanine. It is pre-dosed in two sizes by bird weight, with millet, banana and anise cues for wary birds, and no added iron.
  research:
  - 'Owner-problem phase: retailer listings, reviews and owner forums. Owners had tried everything; dosing failed in the beak or the water bowl; and one of Europe''s largest pet retailers listed no bird calming product at all.'
  - 'Literature pass: our AI-powered research system cross-checked 71 PubMed-indexed papers; our team reviewed each claim. Pigeon GABA-A receptor subunits are 94.6-96.3% identical to reference sequences, so the peptide''s target exists in birds, but no study has measured its absorption in any bird.'
  - 'A second, stricter pass found the laying-hen fibre trials and changed the formula: the carrier became the lead active, and a maltodextrin carrier was ruled out for good.'
  - Safety shaped the format. Small budgerigars have a thin margin against rodent safety data, so small birds get a separate, smaller stick. No added iron, calcium, vitamin D3, vitamin A or sodium; every anise lot is identity-tested to exclude star anise.
  inside:
  - name: Insoluble fibre (lignocellulose)
    role: 'The lead active: more insoluble fibre cut severe feather pecking in controlled hen trials.'
  - name: L-tryptophan
    role: Serotonin precursor; in hens, low tryptophan is linked to more feather pecking.
  - name: Alpha-casozepine (milk protein hydrolysate)
    role: Calming peptide shared with our cat and rabbit lines; its receptor target is conserved in birds.
  - name: L-theanine
    role: Amino acid from tea leaves; a gentle second calming ingredient with a wide safety margin.
  - name: DL-methionine and biotin
    role: Sulphur amino acid and vitamin the bird uses to build feather keratin.
  - name: Millet, banana and anise
    role: Familiar tastes and smells so wary birds accept the powder on their food.
  evidence:
  - text: In laying hens fed diets with 3%, 6% or 9% insoluble fibre, severe feather pecking fell from 0.78 to 0.31 to 0.12 pecks per 30 minutes per hen (P<0.0001), plumage stayed better and laying performance was unchanged. Hens, not parrots.
    ref: 1
  - text: In 1,600 laying hens fed from 16 to 50 weeks of age, a diet higher in insoluble fibre improved feather cover (P=0.016) and reduced rear-body pecking injuries (P=0.012). Hens, not parrots.
    ref: 2
  - text: In growing bantams, adding L-tryptophan to the diet at 20 g/kg suppressed feather-pecking damage compared with no added tryptophan. Bantams, not parrots, and at a higher dietary level than our stick provides.
    ref: 3
  - text: In 160 laying hens, acute tryptophan depletion induced gentle, repetitive feather pecking in all three genetic lines tested, linking the serotonin system to pecking. Hens; a mechanism study, not a supplement trial.
    ref: 4
  limits:
  - No study has tested alpha-casozepine in any bird, and the fibre and tryptophan evidence comes from chickens, not parrots.
  - PlumaCalm has not yet been tested in parrots. Our research calls for acceptance and small-bird tolerance studies before launch.
  - Feather plucking often has medical causes, so see an avian vet first. Allow four to eight weeks; new feathers depend on the moult.
  use: Sprinkle one stick over damp chopped vegetables or soaked pellets, mix, and serve within 15 minutes. Not on dry seed or in water. Choose the stick size by bird weight.
