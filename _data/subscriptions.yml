  # The include is fixed markup; changing these values alone cannot swap forms.
  inline:
    form_id: "10113119"
    uid: "924e9b0702"
    action: "https://app.kit.com/forms/10113119/subscriptions"
    script_url: "https://f.convertkit.com/ckjs/ck.5.js"
    email_field: email_address
    topic_field: "tags[]"
