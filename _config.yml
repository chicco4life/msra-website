# MSRA website — built automatically by GitHub Pages on every change.
title: MSRA — Mystical Species Research Academy
tagline: Every species, every condition
# Search and sharing (see _includes/seo.html and _includes/schema.html).
# Every other page's browser-tab title is "<page seo_title or title> | <brand>".
brand: MSRA Lab
short_name: MSRA
org_name: Mystical Species Research Academy
home_title: "MSRA Lab: research-backed supplements for rabbits, reptiles, parrots and cats"
default_image: /assets/img/tortoise.webp
logo_wide: /assets/img/wordmark.png
description: >-
  MSRA is a pet nutrition research lab building dedicated, research-backed products
  for the species and conditions the industry overlooks: reptiles, rabbits and small
  mammals, parrots and cats.
url: "https://msralab.com"
baseurl: ""
# Prepared release switches. Enable after full-site verification; no deployment is performed here.
localization_public_release: true
language_routing_enabled: true
contact_email: li@msralab.com
# GA4 measurement ID. The shared layout loads it only in production builds.
google_analytics: G-R7JTFRCH80
# The open research knowledge base. Research pages read notes and studies from it live.
repo_url: https://github.com/chicco4life/MSRA-Open-Research
research_repo: chicco4life/MSRA-Open-Research
research_branch: main
logo: /assets/img/favicon.png

excerpt_separator: ""

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap

# Research reports, copied from the knowledge base by tools/sync_research.py, one page each at /research/<folder>/.
collections:
  research:
    output: true
    permalink: /research/:name/
  articles:
    output: true
    permalink: /learn/:name/
  # Complete translated manuscripts remain separate from the English collections.
  # Each local draft declares its actual locale-prefixed permalink explicitly.
  localized:
    output: true
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: default
  - scope:
      path: ""
      type: research
    values:
      layout: report
  - scope:
      path: ""
      type: articles
    values:
      layout: knowledge-article
      editorial: true
      robots: noindex
      sitemap: false
  # Library implementation is in editorial preview until an explicit release.
  - scope:
      path: learn
    values:
      robots: noindex
      sitemap: false
  - scope:
      path: ""
      type: localized
    values:
      editorial: true
      publication_state: editorial-draft
      release_approved: false
      robots: noindex
      sitemap: false

exclude:
  - README.md
  - docs/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .gitignore
  - tools/
