<dialog class="wl" id="waitlist" aria-labelledby="wl-title">
  <button type="button" class="wl-x" id="wl-close" aria-label="Close" data-i18n-attr="aria-label:wl.close">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <form class="wl-form" id="wl-form" novalidate>
    <div class="label" data-i18n="wl.label">Pre-order</div>
    <h2 id="wl-title"><span data-i18n="wl.title">Join the waitlist for</span> <span class="wl-name" id="wl-product"></span></h2>
    <p class="wl-lead" data-i18n="wl.lead">No payment now. Leave your email and we will write to you once, when it is ready to ship, with the price and a link to order.</p>
    <label class="fld"><span class="label" data-i18n="wl.email">Email</span>
      <input type="email" id="wl-email" name="email" autocomplete="email" required placeholder="you@example.com"></label>
    <label class="fld"><span class="label" data-i18n="wl.country">Country (optional)</span>
      <input type="text" id="wl-country" name="country" autocomplete="country-name"></label>
    <label class="chk"><input type="checkbox" id="wl-news" name="news"><span data-i18n="wl.news">Also tell me when other MSRA products launch</span></label>
    <button type="submit" class="btn btn-solid wl-go" id="wl-send" data-i18n="wl.send">Join the waitlist</button>
    <p class="wl-fine" data-i18n="wl.fine">We use your email only to tell you about this product.</p>
    <p class="wl-status" id="wl-status" role="status" aria-live="polite"></p>
  </form>
  <div class="wl-done" id="wl-done" hidden>
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 20.5l5.5 5.5L28.5 14" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <h2 data-i18n="wl.done_title">You're on the list.</h2>
    <p><span data-i18n="wl.done_text">We will email you once, when this product is ready to ship:</span> <b class="wl-name" id="wl-done-product"></b></p>
    <button type="button" class="btn btn-line" id="wl-done-close" data-i18n="wl.done_close">Back to the shop</button>
  </div>
</dialog>
